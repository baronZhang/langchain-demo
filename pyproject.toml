[project]
name = "langchain-demo"
version = "0.1.0"
description = "Runnable LangChain 1.x, LangGraph 1.x, Deep Agents, and MCP demos with a reusable project scaffold"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "deepagents>=0.7.32",
    "langchain[mcp]>=1.4.7",
    "langchain-anthropic>=1.7.6",
    "langchain-core>=1.7",
    "langchain-openai>=1.7.3",
    "langchain-text-splitters>=1.1.3",
    "langgraph>=1.2",
    "langgraph-checkpoint-sqlite>=3.1.2",
    "python-dotenv>=1.2.4",
    "numpy>=2.5.4",
]

[project.scripts]
langchain-demo = "langchain_demo:main"

[build-system]
requires = ["uv_build>=0.9.21,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
server = [
    "langgraph-cli[inmem]>=0.4.40",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
